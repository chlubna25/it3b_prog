name: Reconcile Tideland v0.2.0

on:
  push:
    branches: [feature/tideland-v0.2.0-reconcile]
    paths:
      - 'Projekty/Tideland/scripts/reconcile-v020.py'
      - '.github/workflows/tideland-v020-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v6
        with:
          ref: feature/tideland-v0.2.0-reconcile
          fetch-depth: 0

      - name: Apply reconciled local work
        run: python3 Projekty/Tideland/scripts/reconcile-v020.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projekty/Tideland/package-lock.json

      - name: Install dependencies
        working-directory: Projekty/Tideland
        run: npm ci

      - name: Run full unit suite
        working-directory: Projekty/Tideland
        run: npm test

      - name: Build production bundle
        working-directory: Projekty/Tideland
        run: npm run build

      - name: Install browser for smoke test
        working-directory: Projekty/Tideland
        run: npx playwright install --with-deps chromium

      - name: Browser smoke — version, history, FOV and station placement
        working-directory: Projekty/Tideland
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/tideland-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          const domClick=async selector=>page.locator(selector).evaluate(el=>el.click());
          try {
            await page.goto('http://127.0.0.1:5173');
            await page.waitForFunction(()=>window.__TIDELAND);
            await page.locator('.loading-screen').waitFor({state:'hidden'});
            assert.match(await page.locator('.menu-footer').innerText(),/VERSION 0\.2\.0.*EA-02/);
            await domClick('[data-action="history"]');
            assert.equal(await page.locator('.history-panel:not([hidden])').count(),1);
            assert.match(await page.locator('.history-panel').innerText(),/0\.2\.0/);
            await domClick('.history-panel [data-action="history"]');
            await domClick('.menu-screen [data-action="settings"]');
            assert.equal(await page.locator('.settings-screen').evaluate(el=>getComputedStyle(el).display!=='none'),true);
            const slider=page.locator('input[data-setting="fov"]');
            await slider.evaluate(el=>{el.value='60';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForTimeout(100);
            assert(Math.abs((await page.evaluate(()=>window.__TIDELAND.cameraState().world.fov))-60)<0.01);
            await slider.evaluate(el=>{el.value='100';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForTimeout(100);
            assert(Math.abs((await page.evaluate(()=>window.__TIDELAND.cameraState().world.fov))-100)<0.01);
            await domClick('[data-action="settingsBack"]');
            await domClick('.menu-screen [data-action="new"]');
            await page.waitForFunction(()=>window.__TIDELAND.getScreen()==='playing');
            await page.evaluate(()=>{const a=window.__TIDELAND;a.sim().state.inventory[0]={itemId:'storage',count:1};a.teleport({x:55,y:a.height(55,230)+.1,z:230});a.lookAt({x:55,y:a.height(55,227),z:227});});
            await page.keyboard.press('Digit1');
            await page.waitForTimeout(500);
            assert(await page.evaluate(()=>window.__TIDELAND.stationCandidate()?.valid===true));
            const before=await page.evaluate(()=>window.__TIDELAND.snapshot().progression.stations.length);
            await page.mouse.click(720,450);
            await page.waitForTimeout(250);
            const after=await page.evaluate(()=>window.__TIDELAND.snapshot().progression.stations.length);
            assert.equal(after,before+1);
            assert.deepEqual(errors,[]);
          } finally { await browser.close(); }
          NODE

      - name: Remove temporary reconciliation tooling
        run: |
          rm -f Projekty/Tideland/scripts/reconcile-v020.py
          rm -f .github/workflows/tideland-v020-reconcile.yml

      - name: Commit validated v0.2.0
        run: |
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A
          git status --short
          git commit -m 'Tideland v0.2.0 reconciliation'
          git push origin HEAD:feature/tideland-v0.2.0-reconcile
